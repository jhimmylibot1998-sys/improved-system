<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #0A0A0C; 
      color: #F0F0F2;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex; 
      flex-direction: column;
      padding: 64px;
      position: relative;
    }
    .motif { position: absolute; top: 64px; right: 64px; color: #CCFF00; font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; }
    h2 { font-family: 'Syne', sans-serif; font-size: 36px; margin-bottom: 40px; }
    .content { flex: 1; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 64px; align-items: center; }
    .visual-frame { height: 400px; background: linear-gradient(135deg, #182f39, #241e3e); border: 1px solid #2A2A2E; position: relative; display: flex; align-items: center; justify-content: center; }
    .visual-frame::after { content: '▶'; font-size: 48px; color: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.2); width: 100px; height: 100px; border-radius: 50%; display: grid; place-items: center; }
    .text-block h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.15em; color: #00E5FF; margin-bottom: 24px; }
    .text-block p { font-size: 20px; line-height: 1.5; color: #8A8A93; margin-bottom: 32px; }
    .list { list-style: none; }
    .list li { padding: 12px 0; border-bottom: 1px solid #2A2A2E; display: flex; justify-content: space-between; font-size: 16px; }
    .list li span { color: #F0F0F2; font-weight: 700; }
    .footer { display: flex; justify-content: space-between; color: #8A8A93; font-size: 14px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">+</div>
    <h2>AI Video Direction</h2>
    <div class="content">
      <div class="visual-frame"></div>
      <div class="text-block">
        <h3>Cinematic Generative Content</h3>
        <p>We move beyond simple prompts to build consistent, high-fidelity visual worlds for your brand.</p>
        <ul class="list">
          <li>Concept & Visual Language <span>01</span></li>
          <li>Generative Scene Production <span>02</span></li>
          <li>Motion Direction & Editing <span>03</span></li>
          <li>Sound Design & Final Delivery <span>04</span></li>
        </ul>
      </div>
    </div>
    <div class="footer"><div>04</div></div>
  </div>
</body>
</html>
