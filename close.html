<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #0A0A0C; 
      color: #F0F0F2;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex; 
      flex-direction: column;
      padding: 64px;
      position: relative;
    }
    .motif { position: absolute; top: 64px; right: 64px; color: #CCFF00; font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; }
    .content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    h2 { font-family: 'Syne', sans-serif; font-size: 72px; line-height: 1; letter-spacing: -0.04em; margin-bottom: 48px; }
    .gradient-text { background: linear-gradient(90deg, #00E5FF, #9D4EDD); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .contact-info { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; border-top: 1px solid #2A2A2E; padding-top: 48px; }
    .contact-block h4 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.2em; color: #8A8A93; margin-bottom: 16px; }
    .contact-block p { font-size: 32px; font-family: 'Syne', sans-serif; }
    .footer { display: flex; justify-content: space-between; color: #8A8A93; font-size: 14px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">+</div>
    <div class="content">
      <h2>Let’s make the <span class="gradient-text">next thing.</span></h2>
      <div class="contact-info">
        <div class="contact-block">
          <h4>Start a project</h4>
          <p>hello@yourdomain.com</p>
        </div>
        <div class="contact-block">
          <h4>Follow the work</h4>
          <p>@alexmorgan_studio</p>
        </div>
      </div>
    </div>
    <div class="footer"><div>08</div></div>
  </div>
</body>
</html>
